# ====== MySQL 数据源配置（生产环境） ======
# 使用方法: 启动时加 --spring.profiles.active=mysql
# 或者在 application.yml 中设置 spring.profiles.active: mysql
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/adsb_simulation?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456

  h2:
    console:
      enabled: false

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
